<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de Usuario')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('')}"></div>

<div class="container d-flex align-items-center justify-content-center py-5" style="min-height: 82vh;">
    <div class="card card-modern p-4 p-md-5" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <span class="brand-icon-box mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
            </span>
            <h4 class="fw-bold mb-0">Crear Cuenta</h4>
            <p class="text-muted small">Registro de personal en AutoPro</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

        <form th:action="@{/registro}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Nombre Completo *</label>
                <input type="text" name="nombreCompleto" class="form-control" placeholder="Ej. Mariana Paucar" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Nombre de Usuario *</label>
                <input type="text" name="username" class="form-control" placeholder="mpaucar" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Rol en el Taller *</label>
                <select name="rol" class="form-select">
                    <option value="ASESOR">Recepcionista / Asesor</option>
                    <option value="MECANICO">Mecánico Especialista</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña *</label>
                <input type="password" name="password" class="form-control" minlength="4" required>
            </div>
            <button type="submit" class="btn btn-at-primary w-100 py-2">Registrar Cuenta</button>
        </form>
        <div class="mt-3 text-center small">
            ¿Ya tienes cuenta? <a th:href="@{/login}" class="fw-semibold text-decoration-none">Inicia sesión</a>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
