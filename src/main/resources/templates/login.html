<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('')}"></div>

<div class="container d-flex align-items-center justify-content-center py-5" style="min-height: 82vh;">
    <div class="card card-modern p-4 p-md-5" style="width: 100%; max-width: 430px;">
        <div class="text-center mb-4">
            <span class="brand-icon-box mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-car-front-fill"></i>
            </span>
            <h4 class="fw-bold mb-0">AutoPro</h4>
            <p class="text-muted small">Ingresa tus credenciales para acceder al panel</p>
        </div>

        <div th:if="${exito}" class="alert alert-success py-2 small" th:text="${exito}"></div>
        <div th:if="${param.error}" class="alert alert-danger py-2 small">
            Usuario o contraseña incorrectos.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="admin / asesor / mecanico" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="123456" required>
            </div>
            <button type="submit" class="btn btn-at-primary w-100 py-2">Iniciar Sesión</button>
        </form>

        <div class="mt-3 text-center small">
            ¿No tienes cuenta? <a th:href="@{/registro}" class="fw-semibold text-decoration-none">Regístrate aquí</a>
        </div>
        <hr>
        <div class="text-center text-muted" style="font-size: 0.78rem;">
            Usuarios demo: <code>admin</code> | <code>asesor</code> | <code>mecanico</code> (Clave: <code>123456</code>)
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
